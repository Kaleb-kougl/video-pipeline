[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-video-generator"
version = "1.0.0"
description = "AI-powered anime video generation system with comprehensive character and season analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kaleb Kougl", email = "kalebkougl@gmail.com"}
]
keywords = ["anime", "video", "ai", "generation", "character-analysis", "chromadb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core AI and LangChain Dependencies
    "langchain==0.3.27",
    "langchain-core==0.3.72",
    "langchain-google-genai==2.1.8",
    "langchain-text-splitters==0.3.9",
    
    # Google AI Services
    "google-generativeai==0.8.5",
    "google-ai-generativelanguage==0.6.15",
    "google-api-core==2.25.1",
    "google-api-python-client==2.177.0",
    "google-auth==2.40.3",
    "google-auth-httplib2==0.2.0",
    
    # Vector Database and ML
    "chromadb==1.0.15",
    "sentence-transformers==5.0.0",
    "transformers==4.54.0",
    "torch==2.7.1",
    "numpy==2.3.2",
    "scipy==1.16.1",
    "scikit-learn==1.7.1",
    
    # Video and Media Processing
    "moviepy==2.2.1",
    "pillow==11.3.0",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    
    # Web Scraping and HTTP
    "requests==2.32.4",
    "beautifulsoup4==4.13.4",
    "urllib3==2.5.0",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "httplib2==0.22.0",
    
    # Data Processing and Validation
    "pydantic==2.11.7",
    "pydantic-core==2.33.2",
    "SQLAlchemy==2.0.41",
    "orjson==3.11.1",
    
    # Utility Libraries
    "tenacity==9.1.2",
    "jsonpatch==1.33",
    "jsonpointer==3.0.0",
    "PyYAML==6.0.2",
    "typing-extensions==4.14.1",
    "packaging==25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.16.8",
    "pre-commit>=3.6.0",
    "mypy>=1.0.0",
]

[project.scripts]
anime-generator = "main:main"

[project.urls]
Homepage = "https://github.com/kalebkougl/anime-video-generator"
Repository = "https://github.com/kalebkougl/anime-video-generator"
Issues = "https://github.com/kalebkougl/anime-video-generator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "config*", "core*", "media*", "utils*"]

# ---------------------------------------------------------------------------
# Ruff replaces black + flake8 + isort (linter, import sorter and formatter).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "htmlcov",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    # The formatter owns line length. What is left after formatting is long
    # string literals, URLs and log messages that cannot be split mechanically.
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# These modules insert the project root on sys.path before importing from it,
# so their imports cannot sit at the top. Legitimate, not a style slip.
"tests/test_agents_fixed.py" = ["E402"]
"tests/test_season_processing.py" = ["E402"]
"tests/test_transcript_source_agent.py" = ["E402"]
# Re-exports.
"__init__.py" = ["F401"]
# These modules do a `sys.path.insert(0, project_root)` bootstrap before they
# can import the first-party packages, so imports cannot be at the top.
# FOLLOW-UP: drop the bootstrap once the project is always installed (`pip
# install -e .`) and these ignores go away.
"main.py" = ["E402"]
"demos/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "config", "core", "media", "utils"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
# Lenient by default: the shipped packages have 47 functions with no return
# annotation, so a global `disallow_untyped_defs` would fail immediately.
# Strictness is opted into per package (see the overrides below).
disallow_untyped_defs = false
ignore_missing_imports = true
warn_return_any = false

# core.* is the typed beachhead: new code here must be fully annotated.
[[tool.mypy.overrides]]
module = "core.*"
disallow_untyped_defs = true

# FOLLOW-UP: these two modules have pre-existing type errors that need real
# fixes, not annotations:
#   core.metadata_schemas       - `create()` overrides violate the base signature
#   core.visual_coherence_manager - cv2.kmeans overload + Optional str used as
#                                   a dict key / function argument
[[tool.mypy.overrides]]
module = ["core.metadata_schemas", "core.visual_coherence_manager"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Network-touching suites are opt-in: several tests scrape live sites and hang.
markers = [
    "network: test performs live network I/O (deselected by default)",
]
# The `network` marker is the single mechanism for excluding live-network
# suites; `-m 'not network'` below deselects them.
# sites and hangs, but carries no marker yet, so it still has to go by path.
# Add `pytestmark = pytest.mark.network` to it and delete the --ignore line.
addopts = """
    -m 'not network'
    --timeout=120
"""
