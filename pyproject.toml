[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-video-generator"
version = "1.0.0"
description = "AI-powered anime video generation system with comprehensive character and season analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kaleb Kougl", email = "kalebkougl@gmail.com"}
]
keywords = ["anime", "video", "ai", "generation", "character-analysis", "chromadb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core AI and LangChain Dependencies
    "langchain==0.3.27",
    "langchain-core==0.3.72",
    "langchain-google-genai==2.1.8",
    "langchain-text-splitters==0.3.9",
    
    # Google AI Services
    "google-generativeai==0.8.5",
    "google-ai-generativelanguage==0.6.15",
    "google-api-core==2.25.1",
    "google-api-python-client==2.177.0",
    "google-auth==2.40.3",
    "google-auth-httplib2==0.2.0",
    
    # Vector Database and ML
    "chromadb==1.0.15",
    "sentence-transformers==5.0.0",
    "transformers==4.54.0",
    "torch==2.7.1",
    "numpy==2.3.2",
    "scipy==1.16.1",
    "scikit-learn==1.7.1",
    
    # Video and Media Processing
    "moviepy==2.2.1",
    "pillow==11.3.0",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    
    # Web Scraping and HTTP
    "requests==2.32.4",
    "beautifulsoup4==4.13.4",
    "urllib3==2.5.0",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "httplib2==0.22.0",
    
    # Data Processing and Validation
    "pydantic==2.11.7",
    "pydantic-core==2.33.2",
    "SQLAlchemy==2.0.41",
    "orjson==3.11.1",
    
    # Utility Libraries
    "tenacity==9.1.2",
    "jsonpatch==1.33",
    "jsonpointer==3.0.0",
    "PyYAML==6.0.2",
    "typing-extensions==4.14.1",
    "packaging==25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
anime-generator = "main:main"

[project.urls]
Homepage = "https://github.com/kalebkougl/anime-video-generator"
Repository = "https://github.com/kalebkougl/anime-video-generator"
Issues = "https://github.com/kalebkougl/anime-video-generator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "config*", "core*", "media*", "utils*"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Network-touching suites are opt-in: several tests scrape live sites and hang.
markers = [
    "network: test performs live network I/O (deselected by default)",
]
addopts = "-m 'not network' --timeout=120"
