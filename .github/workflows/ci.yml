name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.8"
  MYPY_VERSION: "2.3.1"

jobs:
  # Lint and type checks need no project dependencies, so they run once on a
  # single interpreter and finish in seconds.
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint (ruff)
        run: uvx ruff@${{ env.RUFF_VERSION }} check .

      - name: Format check (ruff)
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

      # Scoped on purpose: strict typing is only enforced for core.* today.
      # See the [tool.mypy] overrides in pyproject.toml.
      - name: Type check (mypy, core only)
        run: uvx mypy@${{ env.MYPY_VERSION }} --no-incremental core

  # Documentation drift gets its own job so a docs failure reads as "docs" in
  # the checks list instead of being one red line inside a 360-test run.
  #
  # It installs five small packages, not requirements.txt: the contract resolves
  # documented symbols by parsing the source with `ast` rather than importing
  # it, so none of the ML stack is needed. pydantic and SQLAlchemy are here only
  # because tests/conftest.py imports core.database at collection time.
  docs:
    name: Documentation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The `<!-- verified: <sha> -->` claim tags ask git whether the
          # sources behind a measured number have moved since that commit.
          # A shallow clone cannot answer, and the check skips rather than
          # fails - so fetch the history and make it answerable.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtualenv
        run: uv venv --python 3.12

      - name: Install the documentation test's dependencies
        run: >-
          uv pip install
          'pytest>=7.4.0' 'pytest-asyncio>=0.23.0' 'pytest-timeout>=2.2.0'
          'pydantic==2.11.7' 'SQLAlchemy==2.0.41'

      - name: Check the documentation contract
        run: >-
          .venv/bin/python -m pytest
          tests/test_docs_contract.py tests/test_documentation.py

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      # Network-touching suites are excluded by pyproject's addopts
      # (`-m 'not network'` plus the --ignore list), so a bare `pytest` here
      # runs exactly what runs locally.
      - name: Run tests
        env:
          # Nothing should reach the network or a model hub during the suite;
          # fail loudly instead of hanging if something tries.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: .venv/bin/python -m pytest

      # The eval gate is the regression signal for prompt changes: it fails the
      # build if the aggregate score drops, if any single case regresses, or if
      # the prompt stops issuing the instructions the rubric grades.
      # Offline mode replays committed fixtures - no API key, no network.
      - name: Run eval gate
        run: .venv/bin/python evals/run_eval.py
